<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>勇者を倒したい魔王様</title>
<meta name="description" content="罠と魔物で勇者を迎え撃つ、ちびキャラ魔王様のダンジョン防衛ゲーム">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:'DotGothic16',sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{position:relative;max-width:430px;height:100dvh;margin:0 auto;overflow:hidden;background:#000;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.screen{position:absolute;inset:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);display:flex;flex-direction:column;gap:10px;padding:14px 14px 18px;overflow-y:auto}
.win{background:rgba(6,4,14,.8);border:4px solid #fff;border-radius:10px;box-shadow:0 0 0 3px #000;padding:10px 14px}
.win.dim{border-color:#5a5a8a}
.win.red{border-color:#ff6b6b}
p{margin:0}
button{font-family:inherit;color:#fff;background:none;border:none;cursor:pointer;padding:0}
.cmd{display:flex;flex-direction:column;gap:6px}
.cmd button{display:flex;align-items:center;gap:8px;font-size:20px;padding:6px 0;text-align:left;min-height:44px}
.cmd button::before{content:'';width:18px;display:inline-block}
.cmd button:hover::before,.cmd button:focus-visible::before,.cmd button.sel::before{content:'▶'}
.cmd button:disabled{color:#5a5a8a}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:15px}
.gold{color:#ffe14a}.red{color:#ff6b6b}.mute{color:#b8b8d8}.purple{color:#d68aff}.green{color:#6bff8a}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px}
.cell{position:relative;border:2px solid rgba(255,255,255,.18);background:rgba(10,8,24,.45);display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;color:#fff}
.cell.wall{background:rgba(0,0,0,.62);border-color:transparent}
.cell img{max-height:88%;max-width:96%}
.cell .lv{position:absolute;right:2px;bottom:0;font-size:10px;color:#ffe14a;text-shadow:1px 1px 0 #000}
.cell.flash{animation:fl .4s steps(2) 2}
@keyframes fl{50%{background:#fff;}}
.tokens{position:absolute;left:0;right:0;bottom:0;top:0;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.tokens img{height:70%;margin:0 -6px;filter:drop-shadow(1px 1px 0 #000)}
.log p{font-size:15px;line-height:1.55}
.blink{animation:bk 1s steps(2) infinite}
@keyframes bk{50%{opacity:0}}
.dlg{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:14px 14px 18px;cursor:pointer;user-select:none}
.dlg .portrait{flex:1;display:flex;align-items:flex-end;justify-content:center;min-height:0}
.dlg .portrait img{max-height:100%;max-width:92%;object-fit:contain}
.dlg .msg{min-height:150px}
.dlg .name{font-size:16px;color:#ffe14a;margin-bottom:6px}
.dlg .text{font-size:18px;line-height:1.6;white-space:pre-wrap}
.dlg .next{position:absolute;right:28px;bottom:calc(30px + 14vh);font-size:14px}
.hp{height:6px;background:#2a2a48;margin-top:4px}
.hp i{display:block;height:100%;background:#6bff8a}
.pal{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.pal button{font-size:14px;padding:6px 2px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid #2a2a48;border-radius:6px;line-height:1.3}
.pal button.on{border-color:#ffe14a;color:#ffe14a}
.pal button small{font-size:11px;color:#b8b8d8}
.stars{position:absolute;inset:0;pointer-events:none}
.title-logo{text-align:center}
.title-logo .sub{font-size:22px;letter-spacing:.12em;text-shadow:3px 3px 0 #c0283f}
.title-logo h1{margin:0;font-weight:400;font-size:84px;line-height:1.1;color:#ffe14a;text-shadow:4px 0 0 #b0402a,-4px 0 0 #b0402a,0 4px 0 #b0402a,0 -4px 0 #b0402a,6px 6px 0 #5a1020}
.en{font-family:'Press Start 2P',monospace;font-size:8px;letter-spacing:.2em;color:#a89ad8}
.toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:30px;color:#ffe14a;text-shadow:3px 3px 0 #b0402a;pointer-events:none;white-space:nowrap}
.hcard{display:flex;gap:10px;align-items:center}
.hcard .pic{width:84px;height:84px;flex-shrink:0;display:flex;align-items:flex-end;justify-content:center;background:#1a1a3a;border:2px solid #5a5a8a}
.hcard .pic img{max-height:80px;max-width:80px}
.zk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.zk .win{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.zk .win .ph{height:120px;display:flex;align-items:flex-end}
.zk .win .ph img{max-height:120px;max-width:100%}
.zk .win p.d{font-size:13px;line-height:1.5;color:#b8b8d8}
.cell .dur{position:absolute;left:2px;top:0;font-size:7px;color:#6bff8a;letter-spacing:-1px}
.cmd a.sharelink{display:flex;align-items:center;gap:8px;font-size:20px;min-height:44px;color:#fff;text-decoration:none}
.cmd a.sharelink::before{content:'';width:18px;display:inline-block}
.cmd a.sharelink:hover::before{content:'▶'}
.pal{grid-template-columns:repeat(4,minmax(0,1fr))}
.shake{animation:sh .35s steps(4)}
@keyframes sh{25%{transform:translate(-6px,3px)}50%{transform:translate(5px,-4px)}75%{transform:translate(-3px,-2px)}}
.chapter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#000;cursor:pointer;animation:fade 1.2s ease-out}
.chapter .ch1{font-size:44px;color:#ffe14a;text-shadow:4px 4px 0 #b0402a;letter-spacing:.1em}
.chapter .ch2{font-size:24px;letter-spacing:.15em}
@keyframes fade{from{opacity:0}to{opacity:1}}
.ico{display:inline-flex;width:86%;height:86%;align-items:center;justify-content:center}
.ico svg{width:100%;height:100%;filter:drop-shadow(1px 2px 0 rgba(0,0,0,.6))}
.pal button .ico{width:28px;height:28px}
.grid{padding:2px}
.dlg{padding-bottom:calc(18px + 14vh) !important}
.lift{height:12vh;flex-shrink:0}
.screen.fixed{overflow:hidden}
.corr{position:relative;flex:1;min-height:180px;overflow-y:auto;border:3px solid rgba(255,255,255,.55);border-radius:10px;box-shadow:0 0 0 3px #000;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.lane{width:64%;margin:0 auto;padding:16px 0 20px;display:flex;flex-direction:column;gap:7px}
.tile{position:relative;display:flex;align-items:center;gap:8px;min-height:58px;padding:4px 8px;border:2px solid rgba(255,255,255,.35);border-radius:8px;background:rgba(10,6,20,.62);color:#fff;font-size:13px;text-align:left;width:100%;font-family:inherit;box-shadow:0 3px 0 rgba(0,0,0,.5)}
.tile.empty{border-style:dashed;background:rgba(10,6,20,.28);justify-content:flex-start}
.tile .no{font-size:10px;color:#b8b8d8;width:14px;flex-shrink:0}
.tile .ico{width:44px;height:44px}
.tile .tt{display:flex;flex-direction:column;line-height:1.35}
.tile .tt small{font-size:11px;color:#d8d0e8}
.tile.gate{background:rgba(20,40,110,.7);border-color:#5a8aff;justify-content:center;gap:10px}
.tile.gate .ico{width:38px;height:38px}
.tile.throne{background:rgba(60,20,80,.75);border-color:#ffe14a;justify-content:center;gap:10px;min-height:66px}
.tile.flash{animation:fl .4s steps(2) 2}
.tk{position:absolute;right:2px;bottom:3px;display:flex;align-items:flex-end;height:50px;pointer-events:none}
.tk img{height:50px;margin-left:-16px;filter:drop-shadow(1px 1px 0 #000)}
</style>
</head>
<body>
<div id="app"></div>
<script src="main.js"></script>
</body>
</html>
