<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>漂流30日 ― 昼は島を歩け。夜は火を守れ。</title>
<meta name="description" content="無人島に漂着。昼は島を探索し、夜は焚き火のそばで明日を決める。実際のサバイバル知識と遭難事例をもとにした、ドット絵のサバイバルシミュレーション。">
<meta property="og:title" content="漂流30日 ― 昼は島を歩け。夜は火を守れ。">
<meta property="og:description" content="水は3日、食料は3週間。あなたは何日生き延びる？">
<meta property="og:type" content="website">
<meta property="og:image" content="https://onelife-game.github.io/drift/og.png">
<meta property="og:url" content="https://onelife-game.github.io/drift/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://onelife-game.github.io/drift/og.png">
<meta name="theme-color" content="#0E1420">
<link rel="icon" href="https://onelife-game.github.io/drift/favicon.png">
<link rel="apple-touch-icon" href="https://onelife-game.github.io/drift/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#060A12;color:#FFFEF2;font-family:"DotGothic16",monospace;font-size:15px}
button{font-family:inherit;cursor:pointer}
.px{image-rendering:pixelated;image-rendering:crisp-edges}
.hidden{display:none!important}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative}
.scr{min-height:100vh;min-height:100dvh;padding-bottom:calc(72px + env(safe-area-inset-bottom))}

/* ---- タイトル ---- */
#title{background:#0E1420;padding-bottom:24px;display:flex;flex-direction:column}
.timg img{width:100%;display:block;aspect-ratio:130/172;max-height:62vh;object-fit:cover;object-position:bottom}
.ttx{text-align:center;margin-top:-6px}
.ttx h1{font-weight:400;font-size:56px;margin:12px 0 4px;color:#F6E7C8;text-shadow:0 4px 0 #3A1C10;letter-spacing:.02em}
.ttx p{margin:0;color:#F2A33A;letter-spacing:.15em;font-size:16px}
.tbtns{display:flex;flex-direction:column;align-items:center;gap:10px;margin:24px 0 10px}
.tb{width:270px;min-height:50px;font-size:17px;background:transparent;color:#F6E7C8;border:2px solid #F6E7C8;padding:8px}
.tb small{display:block;font-size:11px;color:#B4C0D6}
.tb.main{background:#F2A33A;color:#1B1410;border:0;box-shadow:0 4px 0 #8E4A1C;font-size:20px}
.tinfo{font-size:11px;color:#8C9AB3;line-height:1.6;margin:8px 24px 0;text-align:center}

/* ---- 昼 ---- */
#day{background:#0B2A40}
.dh{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px 6px}
.dn{font-size:26px}.dn b{color:#FFD866;font-weight:400}.dn small{font-size:15px;color:#9FD8EC}
.wx{color:#9FD8EC;font-size:15px}
.track{display:flex;gap:4px;align-items:center;padding:0 14px 10px}
.tk{flex:1;text-align:center;font-size:13px;padding:5px 0;background:#1B4F72;color:#9FD8EC}
.tk.done{background:#163E5A;color:#5E8AA8}.tk.now{background:#FFD866;color:#1B1A12}
.tk.nt{flex:1.3;background:#1A1420;color:#F2A33A;box-shadow:inset 0 0 0 2px #F2A33A}
.arr{color:#9FD8EC;font-size:12px}
.map{position:relative;width:100%;aspect-ratio:130/110;overflow:hidden}
.layer{position:absolute;inset:0;width:100%;height:100%}
.spr{position:absolute}
.spr.me{transition:left .45s steps(6),top .45s steps(6);filter:drop-shadow(0 0 0 #000)}
.flick{animation:fl .5s steps(2) infinite}
@keyframes fl{50%{filter:brightness(1.35)}}
.tint{position:absolute;inset:0;pointer-events:none}
.tint.dusk{background:rgba(224,98,58,.22);mix-blend-mode:multiply}
.tint.dawn{background:rgba(255,200,150,.10)}
.rain{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(105deg,transparent 0 14px,rgba(210,230,255,.35) 14px 16px,transparent 16px 31px);animation:rn .4s linear infinite;background-size:62px 62px}
.rain.hard{background:repeating-linear-gradient(110deg,transparent 0 8px,rgba(210,230,255,.45) 8px 10px,transparent 10px 19px);background-size:38px 38px;animation-duration:.25s}
@keyframes rn{to{background-position:-20px 62px}}
.lab{position:absolute;font-size:13px;padding:3px 7px;min-height:28px;border:0;background:rgba(11,42,64,.88);color:#FFFEF2;white-space:nowrap}
.lab.fog{background:#FFFEF2;color:#1B1A12}
.lab.sel{background:#FFD866;color:#1B1A12;box-shadow:0 0 0 2px #1B1A12}
.lab i{font-style:normal;color:#E85D4A;margin-left:3px;font-size:10px}
.place{margin:0 10px;background:#FFFEF2;color:#1B1A12;padding:12px;box-shadow:0 0 0 3px #1B4F72}
.ph{display:flex;justify-content:space-between;align-items:baseline}.ph b{font-size:20px;font-weight:400}.ph span{font-size:12px;color:#5A6470}
.pd{font-size:13px;line-height:1.6;margin:6px 0;color:#3A4048}
.res{font-size:14px;line-height:1.65;background:#EFE6CC;padding:8px 10px;margin:8px 0}
.gets{font-size:12px;color:#2F7D4A;margin:4px 0}
.tip{font-size:12px;line-height:1.6;background:#FFF3C4;padding:6px 8px;margin:6px 0}
.act.fire small{color:#FFE9A8}
.ok{color:#2F7D4A}.ng{color:#B8341F}.cok{background:#2F7D4A;color:#FFFEF2;font-size:11px;padding:1px 4px;vertical-align:2px}
.nh{color:#9FD8A0;font-size:12px}
.goal{margin:0 14px 8px;font-size:13px;background:#14334C;color:#FFD866;padding:6px 10px;border-left:4px solid #FFD866}.goal.ok{color:#9FE0A8;border-color:#7FD08A}
.push{display:flex;align-items:center;gap:6px;font-size:14px;margin:8px 0 0;flex-wrap:wrap}.push input{width:22px;height:22px;accent-color:#B8341F}.push small{font-size:11px;color:#8A5A40;flex-basis:100%;margin-left:28px}
.fm{color:#F2A33A;letter-spacing:-1px}.fm i{font-style:normal;color:#2A5D80}.fm.off{color:#8C9AB3;letter-spacing:0}
.feed{border:2px solid #F2A33A;background:transparent;color:#F2A33A;font-size:12px;padding:2px 8px;min-height:30px}.feed.n{margin-left:6px;min-height:26px;padding:0 6px}
.sks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.sk{font-size:11px;background:#14334C;color:#9FD8EC;padding:2px 6px;display:inline-flex;align-items:center;gap:3px}.sk b{color:#FFD866;font-weight:400}.sk.dg{color:#F6E7C8}
.nscene img.ndog{position:absolute;left:60%;bottom:17%;width:10.8%;height:auto;aspect-ratio:14/11}
.danger{background:#3A1A1A;border-left:4px solid #FF7A6B;padding:8px 10px;margin-top:10px;font-size:12px;line-height:1.6;color:#FFD0C8}.danger b{font-weight:400;color:#FF9A8B;display:block}
.safe{margin-top:10px;font-size:12px;color:#9FD8A0}
.route{border:2px solid #1B1A12;padding:8px 10px;margin-bottom:8px;font-size:13px;line-height:1.7}.route b{font-weight:400;font-size:15px}.route small{color:#5A6470;margin-left:8px}.route .ok{color:#2F7D4A}
.skl{display:grid;grid-template-columns:52px 40px 1fr 70px;align-items:center;gap:6px;font-size:13px;margin:4px 0}.skl b{font-weight:400;color:#B8541F}.skl i{display:block;height:8px;background:#F2A33A;box-shadow:0 0 0 1px #1B1A12}.skl small{font-size:11px;color:#5A6470}
.page{font-size:15px;line-height:1.9;background:#F1E6CC;padding:12px 14px;border-left:4px solid #8A5A34;margin-bottom:8px}
.dex{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.dex div{display:flex;align-items:center;gap:4px;font-size:12px;background:#EFE6CC;padding:4px}.dex .no{color:#9A9080}
.tb.day{border-color:#FFD866;color:#FFD866}
.warn{font-size:12px;color:#B8341F;margin:4px 0}
.plan{font-size:12px;color:#2F7D4A;margin:4px 0}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.act{min-height:54px;border:0;background:#2F7D4A;color:#FFFEF2;font-size:16px;box-shadow:0 4px 0 #1F5A35;text-align:left;padding:6px 10px}
.act small{display:block;font-size:11px;opacity:.85;margin-top:2px}
.act.sub{background:#E8E2CF;color:#1B1A12;box-shadow:0 4px 0 #B9B19A}
.harv{padding:14px 10px 0}
.hh{font-size:12px;color:#9FD8EC;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.hc{display:flex;align-items:center;gap:4px;background:#1B4F72;padding:2px 8px 2px 2px;font-size:13px}
.none{font-size:12px;color:#5E8AA8}
.stat{padding:12px 10px 0}
.meters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.mt{background:#1B4F72;padding:6px 8px}
.meters.n .mt{background:#1A2233}
.mn{display:flex;justify-content:space-between;font-size:12px;color:#9FD8EC}.meters.n .mn{color:#B4C0D6}
.mn b{font-weight:400}
.mb5{display:flex;gap:2px;margin-top:4px}.mb5 i{flex:1;height:8px;background:#2A5D80}.meters.n .mb5 i{background:#2A3550}
.chips2{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:12px}
.wt{color:#9FD8EC}.wt b{color:#FFFEF2;font-weight:400}
.chip{background:#E85D4A;color:#FFFEF2;padding:1px 6px}

/* ---- 下のバー ---- */
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(6,10,18,.94);z-index:5}
.bar button{min-height:46px;border:2px solid #3B5577;background:#14223A;color:#FFFEF2;font-size:15px}

/* ---- 夜 ---- */
#night{background:#0E1420;color:#F6E7C8;padding-left:12px;padding-right:12px;padding-top:12px}
.tally{background:#6B4A2E;padding:8px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 3px 0 #3A2818;font-size:15px}
.tally svg{flex:1;height:22px}
.nscene{position:relative;margin:12px -12px 0}
.nscene img{width:100%;display:block;aspect-ratio:130/64}
.nscene.rainy img{filter:brightness(.7) saturate(.7)}
.nscene.rainy::before{content:'';position:absolute;left:0;right:0;top:0;height:42%;background:repeating-linear-gradient(0deg,#1A2030 0 3px,#222A3C 3px 6px);opacity:.92;z-index:1}
.glow{position:absolute;left:30%;top:20%;width:40%;height:80%;background:radial-gradient(closest-side,rgba(242,163,58,.18),rgba(242,163,58,0));animation:gl 1.6s steps(3) infinite;pointer-events:none}
@keyframes gl{50%{opacity:.5}}
.ngrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px;font-size:13px}
.ngrid div{background:#1A2233;padding:6px 8px}.ngrid div:last-child{grid-column:1/3;color:#B4C0D6}
.ngrid b{font-weight:400}
.meters.n{margin-top:6px}
.ntext{background:#1A2233;padding:10px 12px;margin-top:10px;font-size:13px;line-height:1.7;color:#D8CDB4}
.ntext:empty{display:none}
.nn{color:#F6E7C8}.nw{color:#FF9A8B}
.ch{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 8px}.ch b{font-weight:400;font-size:17px}.ch span{font-size:12px;color:#8C9AB3}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.card{min-height:200px;border:0;background:#F6E7C8;color:#1B1410;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 4px 0 #8C7A5A;transition:transform .12s}
.card.on{background:#F2A33A;box-shadow:0 4px 0 #8E4A1C,0 0 0 3px #FFD866;transform:translateY(-4px)}
.from{font-size:10px;background:#1B1410;color:#C9D98A;padding:1px 5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cn{font-size:15px;line-height:1.25}
.cd{font-size:11px;line-height:1.45;color:#4A3A2A}
.ctag{margin-top:auto;font-size:10px;background:#1B4F72;color:#FFFEF2;padding:2px 5px}
.planpick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px;font-size:13px}
.planpick button{border:2px solid #F6E7C8;background:transparent;color:#F6E7C8;padding:6px 10px;min-height:40px;font-size:14px}
.planpick button.on{background:#F6E7C8;color:#1B1410}
.sleep{display:block;width:100%;min-height:54px;margin-top:16px;border:0;background:#F6E7C8;color:#1B1410;font-size:18px;box-shadow:0 4px 0 #8C7A5A}
#night .bar{background:rgba(14,20,32,.95)}#night .bar button{background:#1A2233;border-color:#3A4660;color:#F6E7C8}

/* ---- シート ---- */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sh{width:100%;max-width:480px;max-height:88vh;overflow:auto;background:#FFFEF2;color:#1B1A12;border-top:4px solid #1B1A12}
.hd{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:#1B1A12;color:#FFD866;font-size:18px;position:sticky;top:0}
.hd button{border:2px solid #FFFEF2;background:transparent;color:#FFFEF2;font-size:13px;padding:6px 10px;min-height:36px}
.bd{padding:14px}
.bd p{line-height:1.7;margin:0 0 10px}
.evtx{font-size:15px;line-height:1.8;margin-bottom:12px}.evtx small{color:#5A6470}
.mb{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.op{min-height:50px;border:2px solid #1B1A12;background:#FFFEF2;color:#1B1A12;font-size:16px;text-align:left;padding:8px 12px;box-shadow:3px 3px 0 #1B1A12;display:block;text-decoration:none}
.op small{display:block;font-size:11px;color:#5A6470;margin-top:2px}
.op.yl{background:#FFD866}
.op:disabled{opacity:.62}
.op img{vertical-align:middle}
.note{font-size:13px;color:#5A6470}
.src{font-size:12px;color:#5A6470;border-top:1px dashed #B9B19A;padding-top:8px}
.ilink{color:#1B4F72}
.nl{font-size:14px;line-height:1.7;padding:2px 0}
.wxline{background:#E8F4F8;padding:8px 10px;margin-bottom:10px;font-size:14px;line-height:1.6}
.inv{display:flex;flex-direction:column;gap:6px}
.iv{display:flex;gap:8px;align-items:center;border-bottom:1px dashed #D6CDB0;padding-bottom:6px}
.iv small{display:block;font-size:11px;color:#5A6470}
.iv b{font-weight:400}
.dot{display:inline-block;background:#D6CDB0;flex-shrink:0}
h4{font-weight:400;margin:14px 0 6px;font-size:15px;border-bottom:2px solid #1B1A12}
.lg div{font-size:13px;padding:2px 0}.lg span{color:#5A6470;margin-right:8px}
.endc{text-align:center;margin-bottom:10px}.endc img{width:100%;display:block}
.et{font-size:26px;margin-top:10px;color:#B8541F}.et.dead{color:#B8341F}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}.kv div{background:#EFE6CC;padding:6px 8px;font-size:12px}.kv b{display:block;font-size:18px;font-weight:400}
#shTx{width:100%;height:92px;padding:8px;font-size:13px;font-family:inherit}
.shg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.shg .op{text-align:center}
.toast{pointer-events:none;position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1B1A12;color:#FFFEF2;padding:10px 14px;font-size:14px;z-index:30;max-width:90%;box-shadow:0 0 0 2px #FFD866}
.toast.big{bottom:auto;top:30%;font-size:15px;line-height:1.7;max-width:420px}

@media (min-width:700px){
  body{background:#060A12}
  #app{max-width:560px}
  .bar,.sh{max-width:560px}
}
</style>
</head>
<body>
<div id="app">
  <div id="title" class="scr hidden"></div>
  <div id="day" class="scr hidden"></div>
  <div id="night" class="scr hidden"></div>
</div>
<script src="data.js"></script>
<script src="game.js"></script>
<script src="ui.js"></script>
</body>
</html>
